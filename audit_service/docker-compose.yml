# audit_service/docker-compose.yml
version: '3.8'

services:
  # El microservicio de Auditoría
  audit_service:
    build:
      context: .
      dockerfile: Dockerfile
      target: development # <--- Apunta al stage de desarrollo
    container_name: audit_service_dev
    ports:
      - "8002:8000"
    volumes:
      - ./app:/app/app # Montamos el código para Hot Reload
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    environment:
      - ENVIRONMENT=development
      # Las credenciales deberían coincidir con los servicios de abajo
      - POSTGRES_SERVER=postgres_audit
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=audit_db
      - REDIS_SERVER=redis_audit
      - REDIS_PORT=6379
      - SECRET_KEY=dev_secret_key_123
      # CORRECCIÓN: Apunta al nombre del servicio
      - OLLAMA_SERVER=ollama
      - OLLAMA_PORT=11434
    depends_on:
      postgres_audit:
        condition: service_healthy
      redis_audit:
        condition: service_healthy

  # Base de Datos
  postgres_audit:
    image: postgres:16-alpine # Usamos Alpine para servicios externos puros
    container_name: postgres_audit_dev
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=audit_db
    ports:
      - "5432:5432"
    volumes:
      - pg_audit_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para eventos
  redis_audit:
    image: redis:7-alpine
    container_name: redis_audit_dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # El Cerebro Local (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_ai
    ports:
      - "11435:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Comando para descargar el modelo automáticamente si no existe al arrancar
    entrypoint: >
      /bin/sh -c "
      ollama serve &
      sleep 5 &&
      ollama run phi3 &
      wait"

  # WORKER ASINCRONO
  process_validation_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development # Usamos el mismo stage ligero
    container_name: audit_ai_worker
    # Sobrescribimos el comando para que corra el script del worker en lugar de FastAPI
    command: ["python", "-m", "app.workers.anomaly_detector"]
    volumes:
      - ./app:/app/app
    environment:
      - ENVIRONMENT=development               
      - POSTGRES_SERVER=postgres_audit
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=audit_db
      - REDIS_SERVER=redis_audit
      - REDIS_PORT=6379
      - SECRET_KEY=dev_secret_key_123 
      - OLLAMA_SERVER=ollama
      - OLLAMA_PORT=11434       
    depends_on:
      redis_audit:
        condition: service_healthy
      postgres_audit:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  ollama_models:
  pg_audit_data: