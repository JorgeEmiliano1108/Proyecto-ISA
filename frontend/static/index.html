<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporativo ISA - Sistema de Gestión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header - Solo visible cuando está logueado -->
        <header class="app-header" id="app-header" style="display: none;">
            <div class="logo">
                <div class="logo-icon">ISA</div>
                <div class="logo-text">
                    <span>CORPORATIVO ISA</span>
                    <span>Sistema de Gestión</span>
                </div>
            </div>
            
            <nav class="main-nav">
                <ul class="nav">
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-page="dashboard">
                            <i class="bi bi-grid-1x2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-menu-button-wide"></i> Menú
                        </a>
                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item" href="#" data-page="evaluations">
                                    <i class="bi bi-clipboard-check"></i> Evaluaciones
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="#" data-page="bonos">
                                    <i class="bi bi-gift"></i> Bonos
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="#" data-page="usuarios">
                                    <i class="bi bi-people"></i> Usuarios
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="#" data-page="reportes">
                                    <i class="bi bi-file-earmark-bar-graph"></i> Reportes
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="#" data-page="aprobaciones">
                                    <i class="bi bi-check-circle"></i> Aprobaciones
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </nav>
            
            <div class="user-info">
                <div class="user-avatar" id="user-avatar">A</div>
                <span class="user-name" id="user-name">Usuario</span>
                <button class="btn-logout" id="logout-btn" style="display: none;">
                    <i class="bi bi-box-arrow-right"></i> Cerrar
                </button>
            </div>
        </header>

        <!-- Contenido Principal -->
        <main class="main-content" id="main-content">
        </main>
    </div>

    <!-- Loading -->
    <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Cargando...</p>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
