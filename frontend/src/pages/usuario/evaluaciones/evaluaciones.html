<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Evaluaciones - ISA Corporativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../../../css/styles.css">
    <link rel="stylesheet" href="../../../components/layout/layout.css">
    <link rel="stylesheet" href="./evaluaciones.css">
</head>
<body>
    <div id="layout-container"></div>

    <main class="page-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark-blue">Mis Evaluaciones</h2>
                    <p class="text-muted">Gestiona tus encuestas pendientes y revisa tu historial de desempeño profesional.</p>
                </div>
            </div>

            <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 15px; border-left: 5px solid #ffc107 !important;">
                <h5 class="fw-bold mb-3 text-warning">⚠️ Pendientes por Completar</h5>
                <div class="row g-3" id="contenedor-pendientes">
                    </div>
            </div>

            <div class="card border-0 shadow-sm p-4" style="border-radius: 15px;">
                <h5 class="fw-bold mb-4">📜 Historial de Evaluaciones</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light text-muted small text-uppercase">
                            <tr>
                                <th>Nombre de la Evaluación</th>
                                <th>Fecha de Aplicación</th>
                                <th>Evaluador</th>
                                <th>Resultado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-historial">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../components/layout/layout.js"></script>
    <script src="./evaluaciones.js"></script>
</body>
</html>
