<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reportes - ISA Corporativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../../../css/styles.css">
    <link rel="stylesheet" href="../../../components/layout/layout.css">
    <link rel="stylesheet" href="./reportes.css">
</head>
<body>
    <div id="layout-container"></div>

    <main class="page-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h2 class="fw-bold text-dark-blue">Mi Historial de Desempeño</h2>
                    <p class="text-muted">Analiza tus métricas a lo largo del tiempo y descarga tus reportes oficiales.</p>
                </div>
                <button class="btn btn-outline-primary fw-bold px-4" id="btn-descargar-todo">
                    📥 Descargar Historial Completo
                </button>
            </div>

            <div class="row g-4 mb-4">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm p-4 h-100" style="border-radius: 15px;">
                        <h6 class="fw-bold mb-4 text-uppercase text-muted small">Tendencia de mi Puntuación</h6>
                        <canvas id="chart-crecimiento-personal" height="280"></canvas>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm p-4 h-100" style="border-radius: 15px;">
                        <h6 class="fw-bold mb-4 text-uppercase text-muted small">Análisis de Competencias</h6>
                        <canvas id="chart-competencias-radar" height="280"></canvas>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm p-4" style="border-radius: 15px;">
                <h6 class="fw-bold mb-4 text-dark-blue">📂 Reportes Generados por el Sistema</h6>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr class="small text-muted">
                                <th>PERÍODO</th>
                                <th>TIPO DE REPORTE</th>
                                <th>CALIFICACIÓN FINAL</th>
                                <th>FECHA DE EMISIÓN</th>
                                <th class="text-end">ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-reportes-usuario">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../components/layout/layout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./reportes.js"></script>
</body>
</html>
