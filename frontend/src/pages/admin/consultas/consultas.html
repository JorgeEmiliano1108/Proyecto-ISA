<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aclaraciones - ISA Corporativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../../css/styles.css">
    <link rel="stylesheet" href="../../../components/layout/layout.css">
    <link rel="stylesheet" href="./consultas.css">
</head>
<body>

    <div id="layout-container"></div>

    <main class="page-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold mb-0">📋 Aclaraciones</h4>
                    <p class="text-muted mb-0 small">Gestiona consultas y notificaciones</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary" onclick="exportarConsultas()">
                        <i class="bi bi-download me-2"></i> Exportar
                    </button>
                </div>
            </div>

            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm p-3 text-center">
                        <div class="icon-circle mx-auto mb-2" style="background: #fff3cd; color: #ffc107;">
                            <i class="bi bi-hourglass-split"></i>
                        </div>
                        <p class="text-muted mb-0 small">Consultas Pendientes</p>
                        <h3 class="fw-bold mb-0" id="stat-pendientes">0</h3>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm p-3 text-center">
                        <div class="icon-circle mx-auto mb-2" style="background: #d1e7dd; color: #198754;">
                            <i class="bi bi-check-circle"></i>
                        </div>
                        <p class="text-muted mb-0 small">Consultas Respondidas</p>
                        <h3 class="fw-bold mb-0" id="stat-respondidas">0</h3>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm p-3 text-center">
                        <div class="icon-circle mx-auto mb-2" style="background: #e7f1ff; color: #0d6efd;">
                            <i class="bi bi-bell"></i>
                        </div>
                        <p class="text-muted mb-0 small">Notificaciones Enviadas</p>
                        <h3 class="fw-bold mb-0" id="stat-notificaciones">0</h3>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-0 py-3">
                    <ul class="nav nav-pills" id="pills-tab" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active" id="pills-consultas-tab" data-bs-toggle="pill" data-bs-target="#pills-consultas" type="button">
                                <i class="bi bi-chat-dots me-1"></i> Consultas
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="pills-notificaciones-tab" data-bs-toggle="pill" data-bs-target="#pills-notificaciones" type="button">
                                <i class="bi bi-bell me-1"></i> Notificaciones
                            </button>
                        </li>
                    </ul>
                </div>
                <div class="card-body p-0">
                    <div class="tab-content" id="pills-tabContent">
                        
                        <div class="tab-pane fade show active" id="pills-consultas" role="tabpanel">
                            <ul class="nav nav-tabs border-bottom px-3 pt-3" id="consultas-subtab" role="tablist">
                                <li class="nav-item">
                                    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#sub-pendientes">
                                        Pendientes <span class="badge bg-danger ms-1" id="badge-pendientes">0</span>
                                    </button>
                                </li>
                                <li class="nav-item">
                                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#sub-respondidas">
                                        Respondidas
                                    </button>
                                </li>
                            </ul>
                            <div class="tab-content p-3">
                                <div class="tab-pane fade show active" id="sub-pendientes" role="tabpanel">
                                    <div class="table-responsive">
                                        <table class="table table-hover mb-0">
                                            <thead class="table-light">
                                                <tr>
                                                    <th class="px-4">Usuario</th>
                                                    <th>Fecha</th>
                                                    <th>Consulta</th>
                                                    <th class="text-end px-4">Acciones</th>
                                                </tr>
                                            </thead>
                                            <tbody id="tabla-pendientes">
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <div class="tab-pane fade" id="sub-respondida" role="tabpanel">
                                    <div class="table-responsive">
                                        <table class="table table-hover mb-0">
                                            <thead class="table-light">
                                                <tr>
                                                    <th class="px-4">Usuario</th>
                                                    <th>Fecha</th>
                                                    <th>Consulta</th>
                                                    <th>Respuesta</th>
                                                    <th class="text-end px-4">Acciones</th>
                                                </tr>
                                            </thead>
                                            <tbody id="tabla-respondidas">
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="tab-pane fade" id="pills-notificaciones" role="tabpanel">
                            <div class="p-4">
                                <div class="row">
                                    <div class="col-lg-5">
                                        <div class="card border-0 shadow-sm p-4 mb-3 mb-lg-0">
                                            <h5 class="fw-bold mb-4"><i class="bi bi-send me-2"></i> Nueva Notificación</h5>
                                            <form id="form-notificacion">
                                                <div class="mb-3">
                                                    <label class="form-label">Tipo</label>
                                                    <select class="form-select" id="notif-tipo">
                                                        <option value="comunicado">Comunicado</option>
                                                        <option value="tarea">Tarea</option>
                                                    </select>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label">Título</label>
                                                    <input type="text" class="form-control" id="notif-titulo" placeholder="Título de la notificación">
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label">Mensaje</label>
                                                    <textarea class="form-control" id="notif-mensaje" rows="3" placeholder="Escribe el mensaje..."></textarea>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label">Fecha límite (opcional)</label>
                                                    <input type="date" class="form-control" id="notif-fecha">
                                                </div>
                                                <button type="button" class="btn btn-primary w-100" onclick="crearNotificacionDesdeAclaraciones()">
                                                    <i class="bi bi-send me-2"></i> Enviar Notificación
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                    <div class="col-lg-7">
                                        <div class="card border-0 shadow-sm p-4">
                                            <h5 class="fw-bold mb-4"><i class="bi bi-clock-history me-2"></i> Historial Enviado</h5>
                                            <div id="lista-historial-notificaciones">
                                                <div class="text-center text-muted py-4">
                                                    <i class="bi bi-inbox fs-1"></i>
                                                    <p class="mb-0 mt-2">No hay notificaciones enviadas</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../components/layout/modal-perfil.js"></script>
    <script src="../../../components/layout/modal-notificaciones.js"></script>
    <script src="../../../components/layout/layout.js"></script>
    <script src="./consultas.js"></script>
</body>
</html>
