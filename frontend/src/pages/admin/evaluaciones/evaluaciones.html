<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño de Evaluaciones - ISA Corporativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../../css/styles.css">
    <link rel="stylesheet" href="../../../components/layout/layout.css">
    <link rel="stylesheet" href="./evaluaciones.css">
</head>
<body>
    <div id="layout-container"></div>

    <main class="page-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-1">
                            <li class="breadcrumb-item"><a href="#" class="text-decoration-none">EVALUACIONES</a></li>
                            <li class="breadcrumb-item active">NUEVA EVALUACIÓN</li>
                        </ol>
                    </nav>
                    <h2 class="fw-bold text-dark-blue">Área de Diseño</h2>
                    <p class="text-muted">Crea evaluaciones de alto impacto para las operaciones globales.</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary px-4 border-0 shadow-sm bg-white" id="btn-draft">
                        <i class="bi bi-save me-1"></i> Guardar Borrador
                    </button>
                    <button class="btn btn-primary px-4 shadow-sm fw-bold" id="btn-publish">
                        <i class="bi bi-send me-1"></i> Publicar Evaluación
                    </button>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 15px;">
                        <h6 class="fw-bold mb-4 d-flex align-items-center gap-2">
                            <span class="icon-small bg-light-blue text-primary">
                                <i class="bi bi-info-circle"></i>
                            </span> 
                            Definición
                        </h6>
                        <form id="evaluation-form">
                            <div class="mb-3">
                                <label class="form-label text-uppercase small fw-bold text-muted">Título de la Evaluación</label>
                                <input type="text" class="form-control bg-light border-0 py-2" placeholder="ej. Velocidad de Ingeniería Q4" id="eval-title">
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-uppercase small fw-bold text-muted">Descripción</label>
                                <textarea class="form-control bg-light border-0" rows="4" placeholder="Define brevemente los objetivos..." id="eval-desc"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-uppercase small fw-bold text-muted">Público Objetivo</label>
                                <select class="form-select bg-light border-0" id="eval-audience">
                                    <option selected disabled>Seleccionar Audiencia...</option>
                                    <option value="senior_engineering">Personal Senior de Ingeniería</option>
                                    <option value="product_design">Grupo de Diseño de Producto</option>
                                    <option value="regional_management">Gerencia Regional</option>
                                    <option value="global_sales">Fuerza de Ventas Global</option>
                                </select>
                            </div>
                        </form>
                    </div>

                    <div class="card border-0 shadow-sm p-4 bg-light-blue-gradient" style="border-radius: 15px;">
                        <h6 class="fw-bold mb-1">Puntuación de Impacto</h6>
                        <p class="small text-muted mb-3">Tiempo estimado y profundidad de complejidad.</p>
                        <div class="d-flex align-items-end gap-3">
                            <div class="bar-chart-mini d-flex gap-1">
                                <div class="bar bg-primary" style="height: 20px;"></div>
                                <div class="bar bg-primary" style="height: 35px;"></div>
                                <div class="bar bg-primary" style="height: 25px;"></div>
                                <div class="bar bg-primary" style="height: 40px;"></div>
                            </div>
                            <div>
                                <h3 class="fw-bold mb-0">18.5m</h3>
                                <span class="small text-muted">DURACIÓN PROM.</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm p-4 h-100" style="border-radius: 15px;">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h6 class="fw-bold mb-0 d-flex align-items-center gap-2">
                                <span class="icon-small bg-light-green text-success">
                                    <i class="bi bi-card-checklist"></i>
                                </span> 
                                Plantilla de Criterios
                            </h6>
                            <span class="text-muted small fw-bold" id="items-count">0 ELEMENTOS AÑADIDOS</span>
                        </div>

                        <div id="criteria-container">
                            </div>

                        <div class="d-flex justify-content-center gap-3 mt-4 border-top pt-4">
                            <button class="btn btn-light btn-type border-0 py-2 px-3" onclick="addCriterion('OPCIÓN MÚLTIPLE')">
                                <i class="bi bi-ui-radios text-primary d-block mb-1 fs-5"></i> Opción Múltiple
                            </button>
                            <button class="btn btn-light btn-type border-0 py-2 px-3" onclick="addCriterion('ESCALA LINEAL')">
                                <i class="bi bi-sliders text-success d-block mb-1 fs-5"></i> Escala Lineal
                            </button>
                            <button class="btn btn-light btn-type border-0 py-2 px-3" onclick="addCriterion('TEXTO LARGO')">
                                <i class="bi bi-textarea-t text-warning d-block mb-1 fs-5"></i> Texto Largo
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../components/layout/layout.js"></script>
    <script src="../../../components/layout/modal-notificaciones.js"></script>
    <script src="../../../components/layout/modal-perfil.js"></script>
    <script src="./evaluaciones.js"></script>
</body>
</html>
