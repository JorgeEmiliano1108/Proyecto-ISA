<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema ISA - Evaluación de Desempeño</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <h1>Sistema ISA</h1>
            </div>
            <nav class="main-nav">
                <ul id="menu" class="nav">
                    <li class="nav-item"><a href="#" class="nav-link text-white" data-page="dashboard">Dashboard</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link text-white dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            Menú
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" data-page="evaluations">Evaluaciones</a></li>
                            <li><a class="dropdown-item" href="#" data-page="bonos">Bonos</a></li>
                            <li><a class="dropdown-item" href="#" data-page="usuarios">Usuarios</a></li>
                            <li><a class="dropdown-item" href="#" data-page="reportes">Reportes</a></li>
                            <li><a class="dropdown-item" href="#" data-page="aprobaciones">Aprobaciones</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
            <div class="user-info">
                <span id="user-name" class="text-white">Usuario</span>
                <button id="logout-btn" class="btn btn-danger btn-sm">Cerrar Sesión</button>
            </div>
        </header>

        <main class="main-content" id="main-content">
        </main>
    </div>

    <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Cargando...</p>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
