<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema ISA - Evaluación de Desempeño</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <h1>Sistema ISA</h1>
            </div>
            <nav class="main-nav">
                <ul id="menu">
                    <li><a href="#" data-page="dashboard">Dashboard</a></li>
                    <li><a href="#" data-page="evaluations">Evaluaciones</a></li>
                    <li><a href="#" data-page="bonos">Bonos</a></li>
                    <li><a href="#" data-page="usuarios">Usuarios</a></li>
                    <li><a href="#" data-page="reportes">Reportes</a></li>
                    <li><a href="#" data-page="aprobaciones">Aprobaciones</a></li>
                </ul>
            </nav>
            <div class="user-info">
                <span id="user-name">Usuario</span>
                <button id="logout-btn" class="btn-logout">Cerrar Sesión</button>
            </div>
        </header>

        <main class="main-content" id="main-content">
            <!-- El contenido se carga dinámicamente -->
        </main>
    </div>

    <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Cargando...</p>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="config/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
