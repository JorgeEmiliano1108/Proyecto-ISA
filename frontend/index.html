<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISA Corporativo - Gestión</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./src/pages/login/login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-left">
            <div class="grid-pattern"></div>
            <div class="circle-decoration circle-1"></div>
            <div class="circle-decoration circle-2"></div>
            <div class="circle-decoration circle-3"></div>
            
            <div class="login-brand animate-fade-up">
                <div class="brand-logo">ISA</div>
                <div class="brand-text">CORPORATIVO</div>
                <div class="brand-divider"></div>
                <p class="brand-subtitle">Sistema de Gestión de Desempeño</p>
            </div>
        </div>
        
        <div class="login-right">
            <div class="login-form-container animate-fade-in">
                <h2 class="login-title">Bienvenido</h2>
                <p class="login-instruction">Por favor, ingresa tus credenciales para continuar.</p>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Usuario</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input type="text" class="form-control" id="username" required placeholder="Ingresa tu usuario">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Contraseña</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" class="form-control" id="password" required placeholder="••••••••">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-login w-100">
                        <span>Iniciar Sesión</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </form>
                
                <div class="login-footer">
                    <p>&copy; 2026 ISA Corporativo. Todos los derechos reservados.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./src/pages/login/login.js"></script>
</body>
</html>
