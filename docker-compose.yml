version: '3.8'

services:
  backend:
    build:
      context: ./backend_django
      dockerfile: Dockerfile
    container_name: isa_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - ./backend_django:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - isa_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: isa_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    volumes:
      - ./frontend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - isa_network

  db:
    image: postgres:15-alpine
    container_name: isa_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME:-isa_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - isa_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  isa_network:
    driver: bridge